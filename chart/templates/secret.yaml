{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tbls-ask-agent-slack.secretName" . }}
  labels:
    {{- include "tbls-ask-agent-slack.labels" . | nindent 4 }}
type: Opaque
stringData:
  slack-app-token: {{ .Values.secret.slackAppToken | quote }}
  slack-oauth-token: {{ .Values.secret.slackOAuthToken | quote }}
  {{- if eq .Values.provider "openai" }}
  openai-api-key: {{ .Values.secret.openaiApiKey | quote }}
  {{- else if eq .Values.provider "gemini" }}
  gemini-api-key: {{ .Values.secret.geminiApiKey | quote }}
  {{- end }}
  github-token: {{ .Values.secret.githubToken | default "" | quote }}
{{- end }}
