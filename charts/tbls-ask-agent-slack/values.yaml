# Default values for tbls-ask-agent-slack.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/kromiii/tbls-ask-agent-slack
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Application configuration
config:
  # Model name for LLM (e.g. gpt-4o, gpt-4o-mini)
  modelName: "gpt-4o-mini"
  # Base URL for OpenAI-compatible endpoints (optional)
  openaiBaseUrl: ""
  # Custom instruction for LLM (optional)
  customInstruction: ""
  # When set to true, outputs prompt contents to logs (optional)
  debugMode: false

# Secret configuration for sensitive environment variables
secret:
  # If true and existingSecret is not set, a Secret will be created
  create: true
  # Name of an existing Secret to use instead of creating one
  existingSecret: ""
  # Sensitive values (used when create is true and existingSecret is empty)
  slackAppToken: ""
  slackOAuthToken: ""
  openaiApiKey: ""
  githubToken: ""
  # Secret keys mapping to environment variables
  keys:
    slackAppToken: "slack-app-token"
    slackOAuthToken: "slack-oauth-token"
    openaiApiKey: "openai-api-key"
    githubToken: "github-token"

# Schemas configuration (mounted to /app/schemas/config.yml)
schemas:
  # If true and existingConfigMap is not set, a ConfigMap will be created
  create: true
  # Name of an existing ConfigMap to use instead of creating one
  existingConfigMap: ""
  # Mount path inside the container
  mountPath: "/app/schemas"
  # Schema configuration content for config.yml
  config: |
    schemas:
      - name: "wordpress"
        path: "https://raw.githubusercontent.com/k1LoW/tbls-ask/main/testdata/wordpress.json"
      - name: "test"
        path: "https://raw.githubusercontent.com/k1LoW/tbls/main/sample/mysql/schema.json"

# Additional environment variables to pass to the container
extraEnv: []

# Additional volumes to mount
extraVolumes: []

# Additional volume mounts
extraVolumeMounts: []

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
