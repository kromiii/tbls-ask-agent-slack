{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tbls-ask-agent-slack.secretName" . }}
  labels:
    {{- include "tbls-ask-agent-slack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $keySlackApp := .Values.secret.keys.slackAppToken | default "slack-app-token" }}
  {{- $keySlackOAuth := .Values.secret.keys.slackOAuthToken | default "slack-oauth-token" }}
  {{- $keyOpenAI := .Values.secret.keys.openaiApiKey | default "openai-api-key" }}
  {{- $keyGitHub := .Values.secret.keys.githubToken | default "github-token" }}
  {{ $keySlackApp }}: {{ .Values.secret.slackAppToken | default "" | quote }}
  {{ $keySlackOAuth }}: {{ .Values.secret.slackOAuthToken | default "" | quote }}
  {{ $keyOpenAI }}: {{ .Values.secret.openaiApiKey | default "" | quote }}
  {{- if .Values.secret.githubToken }}
  {{ $keyGitHub }}: {{ .Values.secret.githubToken | quote }}
  {{- end }}
{{- end }}
