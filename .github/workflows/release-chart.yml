name: Release Helm Chart to GHCR

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and Push Helm Chart
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            CHART_VERSION="${GITHUB_REF_NAME#v}"
            APP_VERSION="${GITHUB_REF_NAME}"
          else
            CHART_VERSION="0.0.0-${GITHUB_SHA::7}"
            APP_VERSION="latest"
          fi

          mkdir -p .cr-release-packages
          helm package chart --version "${CHART_VERSION}" --app-version "${APP_VERSION}" -d .cr-release-packages

          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push ".cr-release-packages/tbls-ask-agent-slack-${CHART_VERSION}.tgz" "oci://ghcr.io/${OWNER_LC}/charts"
